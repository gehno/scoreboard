name: scoreboard_app
description: Offline scoreboard for sport games with an operator UI, layout editor and display window.
publish_to: none

# Single source of truth for the release version (see CHANGELOG.md).
version: 1.0.0+1
# Read at runtime by the About dialog.
app_author: Henrik Frühling

environment:
  sdk: ^3.14.0

dependencies:
  archive: ^4.7.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_svg: ^2.5.1
  material_ui: ^1.1.0
  scoreboard_core:
    path: ../../packages/scoreboard_core

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - pubspec.yaml
    - assets/icon/app_icon.png

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  windows:
    generate: true
    icon_size: 256
  web:
    generate: false
