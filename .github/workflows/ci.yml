name: Build, test and release

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test-core:
    name: Test core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Install core dependencies
        working-directory: packages/scoreboard_core
        run: dart pub get
      - name: Analyze core
        working-directory: packages/scoreboard_core
        run: dart analyze --fatal-infos
      - name: Test core
        working-directory: packages/scoreboard_core
        run: dart test

  test-windows:
    name: Test Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Install app dependencies
        working-directory: apps\scoreboard
        run: flutter pub get
      - name: Analyze app
        working-directory: apps\scoreboard
        run: flutter analyze --no-pub
      - name: Test app
        working-directory: apps\scoreboard
        run: flutter test --no-pub

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Install app dependencies
        working-directory: apps\scoreboard
        run: flutter pub get
      - name: Compile Windows debug build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: apps\scoreboard
        run: flutter build windows --debug --no-pub
      - name: Build Windows release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        working-directory: apps\scoreboard
        run: flutter build windows --release --no-pub
      - name: Package Windows release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          $bundle = '.\apps\scoreboard\build\windows\x64\runner\Release'
          if (-not (Test-Path "$bundle\scoreboard_app.exe") -or
              -not (Test-Path "$bundle\flutter_windows.dll") -or
              -not (Test-Path "$bundle\data\flutter_assets")) {
            throw 'The Windows release bundle is incomplete.'
          }
          Copy-Item .\LICENSE, .\CHANGELOG.md -Destination $bundle
          Compress-Archive -Path "$bundle\*" -DestinationPath .\scoreboard-windows-x64.zip
      - name: Upload Windows release artifact
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard-windows-x64
          path: scoreboard-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [test-core, test-windows, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract matching changelog
        shell: bash
        run: |
          bash ./.github/scripts/release-notes.sh \
            "$GITHUB_REF_NAME" \
            ./CHANGELOG.md \
            ./apps/scoreboard/pubspec.yaml \
            "$RUNNER_TEMP/release-notes.md"
      - name: Download Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: scoreboard-windows-x64
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            './scoreboard-windows-x64.zip',
            '--verify-tag',
            '--title', $env:GITHUB_REF_NAME,
            '--notes-file', (Join-Path $env:RUNNER_TEMP 'release-notes.md')
          )
          if ($env:GITHUB_REF_NAME -match '-') {
            $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
